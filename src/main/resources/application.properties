spring.application.name=base-loquito

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/loquito
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de logs del laboratorio
logging.level.com.elloquito.baseloquito=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Desactivar Open Session in View
spring.jpa.open-in-view=false